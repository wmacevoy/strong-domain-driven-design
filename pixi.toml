# The prover's Python: libclang, to read C++ as Clang does. Lean is not here: tools/lean.sh fetches
# the release pinned. No lock file is committed (.gitignore), as in oopc, where this came from.
[workspace]
name = "strong-domain-driven-design"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[dependencies]
python = ">=3.9"

[pypi-dependencies]
libclang = "*"
