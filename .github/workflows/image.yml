# Builds the prover's tools as an image (tools/image/Dockerfile) and publishes it to GitHub's
# registry, when what it is made of changes. Programs name it by its digest, so a new image is
# taken by a change there, never by surprise.
name: image
on:
  push:
    branches: [main]
    paths: [tools/image/**, tools/lean.sh, tools/lean-slim.sh, .github/workflows/image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/image/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/strong-domains-prover:lean-4.36.0
